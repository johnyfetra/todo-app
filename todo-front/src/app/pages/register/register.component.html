<div class="container" style="display:grid; place-items:center; min-height: calc(100vh - 64px);">
  <mat-card class="card">
    <h2>Créer un compte</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" required>
        <mat-error *ngIf="form.controls['email'].invalid && form.controls['email'].touched">Email invalide</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput formControlName="password" type="password" required>
        <mat-error *ngIf="form.controls['password'].invalid && form.controls['password'].touched">8 caractères minimum</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Confirmer le mot de passe</mat-label>
        <input matInput formControlName="confirmPassword" type="password" required>
        <mat-error *ngIf="form.errors?.['mismatch'] && form.controls['confirmPassword'].touched">Les mots de passe ne correspondent pas</mat-error>
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">S'inscrire</button>
    </form>
  </mat-card>
</div>

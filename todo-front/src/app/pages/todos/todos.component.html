<div class="container">

    <!-- Add Form Card -->
    <mat-card style="border-radius: 16px; margin-bottom: 16px; background:#ffffff; padding: 25px;">
      <form [formGroup]="form" (ngSubmit)="add()" style="display:flex; gap: 12px; align-items: center;">
        <mat-form-field appearance="outline" style="flex:1; border-radius: 12px;">
          <mat-label>Nouvelle tâche</mat-label>
          <input matInput formControlName="title" placeholder="Nouvelle tâche">
        </mat-form-field>
        <button mat-stroked-button type="submit" [disabled]="form.invalid" style="margin-left: 8px;">Ajouter</button>
      </form>
    </mat-card>

  <!-- Progress Bar + Stats -->
  <app-todo-progress [value]="progress" [done]="doneCount" [total]="todos.length"></app-todo-progress>

  <!-- Filter below progress -->
  <app-todo-filter [(value)]="filter"></app-todo-filter>

  <!-- Todo list -->
  <app-todo-list [items]="filtered" (toggle)="toggle($event)" (remove)="confirmDelete($event)"></app-todo-list>

</div>

<div class="container">

   <!-- Bouton d'ajout -->
   <div style="display: flex; justify-content: flex-end;">
    <button
    mat-raised-button
    color="primary"
    type="submit"
    (click)="add()"
    >
    <mat-icon>add</mat-icon>
    Créer
  </button>

  </div>
  <!-- Progress Bar + Stats -->
  <app-todo-progress [value]="progress" [done]="doneCount" [total]="todos.length"></app-todo-progress>

  <!-- Filter below progress -->
  <app-todo-filter [(value)]="filter"></app-todo-filter>

  <!-- Todo list -->
  <app-todo-list [items]="filtered" (toggle)="toggle($event)" (remove)="confirmDelete($event)" (moreInfo)="openMoreInfoDialog($event)" (edit)="onEditTaskDialog($event)"></app-todo-list>

</div>

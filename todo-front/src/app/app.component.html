<mat-toolbar color="primary" style="backdrop-filter: blur(4px);">
  <button mat-icon-button aria-label="Menu">
    <mat-icon>check_circle</mat-icon>
  </button>
  <span style="margin-left: 8px; font-weight: 800; letter-spacing: .4px;">Todo App</span>
  <span style="flex: 1 1 auto;"></span>
  <ng-container *ngIf="!isAuthenticated; else logged">
    <button mat-stroked-button routerLink="/login" style="margin-left: 8px;">Login</button>
    <button mat-stroked-button routerLink="/register" style="margin-left: 8px;">Register</button>
  </ng-container>
  <ng-template #logged>
    <button mat-stroked-button (click)="logout()"style="margin-left: 8px;">Déconnexion</button>

  </ng-template>
</mat-toolbar>

<div class="container">
  <router-outlet></router-outlet>
</div>

<app-loader></app-loader>

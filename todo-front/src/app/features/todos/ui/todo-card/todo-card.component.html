<mat-card class="todo" (click)="onCardClick()">
  <div class="row">
    <span class="check-wrap">
      <mat-checkbox
        class="chk"
        [checked]="done()"
        aria-label="Marquer la tâche comme faite"
        (change)="onCheckboxChange($event)"
        (click)="onCheckboxClick($event)"
      >
      </mat-checkbox>

      <!-- SVG particules (explosion) -->
      <svg class="burst" viewBox="0 0 60 60" aria-hidden="true">
        <!-- Rayons -->
        <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
          <line x1="30" y1="6"  x2="30" y2="14" />
          <line x1="30" y1="46" x2="30" y2="54" />
          <line x1="6"  y1="30" x2="14" y2="30" />
          <line x1="46" y1="30" x2="54" y2="30" />
          <line x1="12" y1="12" x2="18" y2="18" />
          <line x1="42" y1="42" x2="48" y2="48" />
          <line x1="12" y1="48" x2="18" y2="42" />
          <line x1="42" y1="18" x2="48" y2="12" />
        </g>
        <!-- Petites particules rondes -->
        <g fill="currentColor">
          <circle cx="30" cy="2"  r="1.8"/>
          <circle cx="30" cy="58" r="1.8"/>
          <circle cx="2"  cy="30" r="1.8"/>
          <circle cx="58" cy="30" r="1.8"/>
          <circle cx="10" cy="20" r="1.4"/>
          <circle cx="50" cy="40" r="1.4"/>
          <circle cx="20" cy="50" r="1.4"/>
          <circle cx="40" cy="10" r="1.4"/>
        </g>
      </svg>
    </span>

    <div class="title" [class.done]="done()" [title]="title()">
      {{ title() }}
    </div>

    <button
      mat-icon-button
      color="primary"
      (click)="onMoreInfoClick($event)"
      aria-label="Plus d'info">
      <mat-icon>info</mat-icon>
    </button>

    <button
    mat-icon-button
    color="default"
    (click)="onEditClick($event)"
    aria-label="Modifier la tâche">
    <mat-icon>edit</mat-icon>
    </button>

    <button
      mat-icon-button
      color="warn"
      (click)="onDeleteClick($event)"
      aria-label="Supprimer la tâche">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</mat-card>

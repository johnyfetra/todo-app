<div class="container" style="display:grid; place-items:center; min-height: calc(100vh - 64px);">
  <mat-card style="width:100%; max-width: 420px; padding: 16px; border-radius: 12px;">
    <h2 style="margin: 0 0 12px 0;">Connexion</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" style="display:flex; flex-direction:column; gap: 12px;">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Email" formControlName="email" type="email">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" placeholder="Mot de passe" formControlName="password">
      </mat-form-field>
      <button mat-raised-button color="primary" [disabled]="!form.value.email || !form.value.password">Se connecter</button>
    </form>
  </mat-card>
</div>
